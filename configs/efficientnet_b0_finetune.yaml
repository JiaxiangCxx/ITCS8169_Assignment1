experiment:
  name: efficientnet_b0_finetune
  seed: 0

data:
  root: data
  train_dir: train
  test_dir: test
  split_file: splits/seed0_val20.json
  val_fraction: 0.20
  image_size: 224
  color_mode: rgb
  augmentation: basic
  batch_size: 64
  num_workers: 8

model:
  name: efficientnet_b0
  pretrained: true
  freeze_backbone_epochs: 3

train:
  epochs: 30
  optimizer: adamw
  learning_rate: 0.00002
  head_lr_multiplier: 10.0
  weight_decay: 0.0001
  scheduler: cosine
  label_smoothing: 0.1
  amp: true
  early_stopping_patience: 8

