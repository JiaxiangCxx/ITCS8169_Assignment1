experiment:
  name: convnext_small_finetune
  seed: 0

data:
  root: dataset
  train_dir: train
  test_dir: test
  split_file: splits/seed0_val20.json
  val_fraction: 0.20
  image_size: 256
  color_mode: rgb
  augmentation: basic
  batch_size: 16
  num_workers: 8

model:
  name: convnext_small
  pretrained: true
  freeze_backbone_epochs: 2

train:
  epochs: 45
  optimizer: adamw
  learning_rate: 0.000005
  head_lr_multiplier: 20.0
  weight_decay: 0.02
  scheduler: cosine
  label_smoothing: 0.05
  amp: true
  early_stopping_patience: 12
