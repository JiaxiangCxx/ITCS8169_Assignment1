experiment:
  name: efficientnet_v2_s_finetune
  seed: 0

data:
  root: dataset
  train_dir: train
  test_dir: test
  split_file: splits/seed0_val20.json
  val_fraction: 0.20
  image_size: 300
  color_mode: rgb
  augmentation: basic
  batch_size: 24
  num_workers: 8

model:
  name: efficientnet_v2_s
  pretrained: true
  freeze_backbone_epochs: 2

train:
  epochs: 40
  optimizer: adamw
  learning_rate: 0.00001
  head_lr_multiplier: 10.0
  weight_decay: 0.01
  scheduler: cosine
  label_smoothing: 0.05
  amp: true
  early_stopping_patience: 10
