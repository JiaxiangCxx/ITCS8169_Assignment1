experiment:
  name: wide_resnet101_2_finetune
  seed: 0

data:
  root: dataset
  train_dir: train
  test_dir: test
  split_file: splits/seed0_val20.json
  val_fraction: 0.20
  image_size: 256
  color_mode: rgb
  interpolation: bilinear
  augmentation: basic
  batch_size: 8
  num_workers: 8

model:
  name: wide_resnet101_2
  pretrained: true
  weights: IMAGENET1K_V2
  freeze_backbone_epochs: 2

train:
  epochs: 35
  optimizer: adamw
  learning_rate: 0.000004
  head_lr_multiplier: 25.0
  weight_decay: 0.01
  scheduler: cosine
  label_smoothing: 0.05
  amp: true
  early_stopping_patience: 10

